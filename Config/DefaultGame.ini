+MapsToCook=(FilePath="/Game/UEMMO/Maps/L_PrototypeArena")
+MapsToCook=(FilePath="/Game/UEMMO/Maps/L_CombatRoom01")
+MapsToCook=(FilePath="/Game/UEMMO/Maps/L_TrainingArena")
+MapsToCook=(FilePath="/Game/UEMMO/Maps/L_SystemTestRoom")
; Explicit cook rule matching the catalog scope: everything under
; /Game/UEMMO/Combat is cooked even when unreferenced, so the packed game can
; load the four definition assets by config path (verified end to end by M1-039).
+DirectoriesToAlwaysCook=(Path="/Game/UEMMO/Combat")
; M5-074: the production room definition asset is referenced by the map's
; ARoomTrigger through a soft path, and soft paths never enter the cook
; dependency chain (the M3-019 precedent) - without this rule the packaged
; combat room cannot resolve DA_room_combat_01 and would refuse entry.
+DirectoriesToAlwaysCook=(Path="/Game/UEMMO/Rooms")

